<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#6b3a00;
    background:repeating-linear-gradient(-26deg,#fff8e6 0 90px,#ffe7a3 90px 180px,#f3dfbe 180px 270px,#fffdf4 270px 360px)}
  .kart{background:rgba(255,253,244,.92);border:4px solid #c9a56a;border-radius:32px;padding:34px 28px;max-width:420px;margin:24px;
    box-shadow:0 18px 40px rgba(90,50,10,.25)}
  h1{margin:0 0 6px;font-size:34px;line-height:1.1;color:#e0457b;text-shadow:0 2px 0 #fff}
  p{margin:8px 0 18px;font-size:17px;line-height:1.35;font-weight:600}
  a.btn{display:block;margin:10px 0;padding:14px 18px;border-radius:999px;font-size:20px;font-weight:800;text-decoration:none;color:#fff;

<div class="kart">

  <small><a href="mailto:muraterdemir42@gmail.com" style="color:inherit">muraterdemir42@gmail.com</a></small>
</div>
<script>
(function(){
  var play="https://play.google.com/store/apps/details?id=com.FarukGames.FarukFlickUp";
  var ios="https://apps.apple.com/tr/app/patlayan-lezzetler/id6833600605?l=tr";
  var ua=navigator.userAgent||"";
  var en=!/^tr/i.test(navigator.language||"tr");
  if(en){
    document.documentElement.lang="en";
    document.getElementById("aciklama").textContent="Match and pop the flavors of Türkiye's 81 provinces!";
    document.getElementById("play").textContent="Get it on Google Play";
    document.getElementById("ios").textContent="Download on the App Store";
  }
  // iPhone/iPad: doğrudan App Store'a; Android ve masaüstü: Google Play'e.
  setTimeout(function(){ location.replace(/iPhone|iPad|iPod/i.test(ua) ? ios : play); }, 250);
})();
</script>

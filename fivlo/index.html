<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fivlo — Dijital Kültür Merkezi</title>
<meta name="description" content="Bu içerik Fivlo'da paylaşıldı. Haberler, bilgi kartları, kitaplar ve topluluk tek uygulamada.">
<meta property="og:title" content="Fivlo — Dijital Kültür Merkezi">
<meta property="og:description" content="Haberler, bilgi kartları, kitaplar ve topluluk tek uygulamada.">
<meta property="og:image" content="https://muraterdemir.dev/fivlo/fivlo.png">
<meta property="og:type" content="website">

<link rel="stylesheet" href="stil.css">
<style>
  .orta { text-align:center; padding-top:48px; }
  .simge { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 30px rgba(0,217,224,.25); }
  .dugme { display:block; margin:12px auto 0; max-width:320px; padding:14px 18px; border-radius:14px; background:var(--vurgu); color:#06222a; font-weight:700; text-decoration:none; }
  .dugme.ikinci { background:var(--kart); color:var(--yazi); border:1px solid var(--cizgi); }
  .magaza { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .magaza a { flex:1 1 150px; max-width:200px; }
  .ipucu { margin-top:22px; font-size:14px; color:var(--soluk); }
</style>
</head>
<body>
<div class="sayfa orta">
  <img class="simge" src="fivlo.png" alt="Fivlo" width="96" height="96">
  <h1 style="margin-top:18px">Fivlo</h1>
  <p class="not">Dijital Kültür Merkezi</p>
  <p>Haberler, bilgi kartları, kitaplar ve topluluk tek uygulamada.</p>

  <a id="ac" class="dugme" href="fivlo://kart/">Uygulamayı aç</a>

  <p class="ipucu">Uygulaman yok mu? Ücretsiz indir:</p>
  <div class="magaza">
    <a class="dugme ikinci" href="https://play.google.com/store/apps/details?id=com.muraterdemir.fivlo">Google Play</a>
    <a class="dugme ikinci" href="https://apps.apple.com/tr/app/id6827251633">App Store</a>
  </div>
  <p class="ipucu"><a href="gizlilik.html">Gizlilik</a> · <a href="topluluk-kurallari.html">Topluluk Kuralları</a></p>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('t') === 'kitap' ? 'kitap' : 'kart';
    var id = q.get('id');
    var a = document.getElementById('ac');
    if (id) a.href = 'fivlo://' + t + '/' + encodeURIComponent(id);
    else a.href = 'fivlo://kart/';
  })();
</script>
</body>
</html>
